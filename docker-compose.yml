services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle}
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jungle} -d ${POSTGRES_DB:-jungle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle}@postgres:5432/${POSTGRES_DB:-jungle}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle}@postgres:5432/${POSTGRES_DB:-jungle}?sslmode=disable
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SQS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      SQS_CONSUMER_MAX_MESSAGES: ${SQS_CONSUMER_MAX_MESSAGES:-10}
      SQS_CONSUMER_WAIT_TIME: ${SQS_CONSUMER_WAIT_TIME:-20s}
      SQS_CONSUMER_INITIAL_BACKOFF: ${SQS_CONSUMER_INITIAL_BACKOFF:-1s}
      SQS_CONSUMER_MAX_BACKOFF: ${SQS_CONSUMER_MAX_BACKOFF:-5m}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_LEASE: ${OUTBOX_LEASE:-30s}
      OUTBOX_INITIAL_BACKOFF: ${OUTBOX_INITIAL_BACKOFF:-1s}
      OUTBOX_MAX_BACKOFF: ${OUTBOX_MAX_BACKOFF:-5m}
      OUTBOX_PUBLISHER_INTERVAL: ${OUTBOX_PUBLISHER_INTERVAL:-1s}
      KEYCLOAK_ISSUER: http://localhost:8081/realms/jungle-go
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/jungle-go/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: wager-api
      SHUTDOWN_TIMEOUT: 20s
      READINESS_TIMEOUT: 2s
      REFERENCE_MAX_ATTEMPTS: ${REFERENCE_MAX_ATTEMPTS:-10}
      REFERENCE_TTL: ${REFERENCE_TTL:-1h}
      REFERENCE_INITIAL_BACKOFF: ${REFERENCE_INITIAL_BACKOFF:-1s}
      REFERENCE_MAX_BACKOFF: ${REFERENCE_MAX_BACKOFF:-5m}
      REFERENCE_WORKER_INTERVAL: ${REFERENCE_WORKER_INTERVAL:-1s}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  localstack_data:
